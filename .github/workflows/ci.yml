name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      # Node 22 runner uploads the self-scan SARIF to Code Scanning.
      security-events: write
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install (reproducible, from the lockfile)
        run: npm ci --no-audit --no-fund
      # Build must precede lint: the dashboard imports package types from
      # skillsentry/dist, and type-aware ESLint rules cannot resolve them
      # until the declaration files exist.
      - name: Build core
        run: npm run build
      - name: Lint (zero warnings tolerated)
        run: npm run lint
      - name: Typecheck (strict, no unchecked index access)
        run: npm run typecheck
      - name: Test (clean gallery must stay clean)
        run: npm test
      - name: Coverage (thresholds enforced)
        run: npm run test:coverage
      # SkillSentry watching SkillSentry: SARIF over the real source (the
      # intentionally poisoned samples/ are excluded) lands in the repo's
      # Code Scanning tab — any future poisoned instruction in packages/ or
      # apps/ becomes a visible GitHub alert, not a silent regression.
      - name: Self-scan SARIF (own source, fixtures excluded)
        if: matrix.node == 22
        run: node packages/skillsentry/scripts/self-sarif.mjs
      - name: Upload SARIF (GitHub Code Scanning)
        if: matrix.node == 22
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: skillsentry.sarif
      - name: Self-scan — clean fixtures must pass (exit 0)
        run: node packages/skillsentry/dist/cli.js samples/skills/clean samples/mcp/clean --no-ai --fail-on medium
      - name: Self-scan — poisoned fixtures must be caught (exit 1 expected)
        run: '! node packages/skillsentry/dist/cli.js samples/skills/poisoned samples/mcp/evil --no-ai --fail-on high'

  dashboard-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install (reproducible, from the lockfile)
        run: npm ci --no-audit --no-fund
      - name: Build core
        run: npm run build
      - name: Build dashboard
        run: npm run build:dashboard
